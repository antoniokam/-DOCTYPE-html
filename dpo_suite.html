        const ComplianceGauge = ({ score }) => {
            const radius = 40;
            const stroke = 8;
            const normalizedScore = Math.max(0, Math.min(score, 100));
            const circumference = normalizedScore * 2 * Math.PI * radius / 100;
            const color = normalizedScore >= 80 ? 'text-green-500' : normalizedScore >= 50 ? 'text-yellow-500' : 'text-red-500';

            return (
                <div className="relative flex items-center justify-center">
                    <svg height={radius * 2 + stroke * 2} width={radius * 2 + stroke * 2} className="transform -rotate-90">
                        <circle stroke="currentColor" fill="transparent" strokeWidth={stroke} r={radius} cx={radius + stroke} cy={radius + stroke} className="text-slate-100" />

                    const gravR = i.gravRes || i.grav;
                    return parseInt(probR) === p && parseInt(gravR) === g;

                                {showModal === 'deadline' && <form onSubmit={(e)=>{e.preventDefault();const fd=new FormData(e.target);const item={task:fd.get('t'),date:fd.get('d')}; if(editItem) updateItem('deadlines',{...editItem, ...item},`Modifica Scadenza`); else addItem('deadlines',item,`Nuova Scadenza`);}}><input name="t" defaultValue={editItem?.task} required className="w-full border p-2 rounded mb-2" placeholder="Attività"/><input name="d" defaultValue={editItem?.date} type="date" required className="w-full border p-2 rounded mb-4"/><button className="w-full bg-blue-600 text-white font-bold py-2 rounded">SALVA</button></form>}

                                {showModal === 'dpia' && <form onSubmit={(e)=>{e.preventDefault();const fd=new FormData(e.target);const p=parseInt(fd.get('p')),g=parseInt(fd.get('g')),risk=calculateRisk(p,g);const pRes=parseInt(fd.get('pRes')),gRes=parseInt(fd.get('gRes')),riskRes=calculateRisk(pRes,gRes);const item={project:fd.get('n'),dept:fd.get('d'),date:editItem ? editItem.date : new Date().toISOString(),prob:p,grav:g,riskScore:risk.sc,riskLevel:risk.lvl,probRes:pRes,gravRes:gRes,riskScoreRes:riskRes.sc,riskLevelRes:riskRes.lvl,status:editItem?editItem.status:"In Corso",mitigations:fd.get('m'),docLink:fd.get('l'), reviewDate: fd.get('rd'), standardsRef: fd.get('std')}; if(editItem) updateItem('dpias',{...editItem, ...item},`Modifica DPIA: ${item.project}`); else addItem('dpias',item,`Nuova DPIA: ${item.project}`);}}><input name="n" defaultValue={editItem?.project} required className="w-full border p-2 rounded mb-2" placeholder="Progetto / Trattamento"/><select name="d" defaultValue={editItem?.dept || ""} required className="w-full border p-2 rounded mb-2"><option value="" disabled>Seleziona Reparto</option>{CM_DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}</select><div className="flex gap-2 mb-2"><div className="w-1/2"><label className="text-[10px] font-bold uppercase text-slate-500">Probabilità Inerente <HelpIcon text="1=Improbabile, 4=Molto Probabile"/></label><select name="p" defaultValue={editItem?.prob} className="border p-2 rounded w-full text-sm"><option value="1">1 - Improbabile</option><option value="2">2 - Poco Prob.</option><option value="3">3 - Probabile</option><option value="4">4 - Molto Prob.</option></select></div><div className="w-1/2"><label className="text-[10px] font-bold uppercase text-slate-500">Gravità Inerente <HelpIcon text="1=Minore, 4=Rilevante"/></label><select name="g" defaultValue={editItem?.grav} className="border p-2 rounded w-full text-sm"><option value="1">1 - Minore</option><option value="2">2 - Moderato</option><option value="3">3 - Significativo</option><option value="4">4 - Rilevante</option></select></div></div><textarea name="m" defaultValue={editItem?.mitigations} className="w-full border p-2 rounded mb-2 h-20 text-sm" placeholder="Misure di mitigazione..."></textarea><div className="flex gap-2 mb-2 bg-green-50 p-2 rounded"><div className="w-1/2"><label className="text-[10px] font-bold uppercase text-green-700">Probabilità Residua</label><select name="pRes" defaultValue={editItem?.probRes || 1} className="border p-2 rounded w-full text-sm"><option value="1">1 - Improbabile</option><option value="2">2 - Poco Prob.</option><option value="3">3 - Probabile</option><option value="4">4 - Molto Prob.</option></select></div><div className="w-1/2"><label className="text-[10px] font-bold uppercase text-green-700">Gravità Residua</label><select name="gRes" defaultValue={editItem?.gravRes || 1} className="border p-2 rounded w-full text-sm"><option value="1">1 - Minore</option><option value="2">2 - Moderato</option><option value="3">3 - Significativo</option><option value="4">4 - Rilevante</option></select></div></div><div className="grid grid-cols-2 gap-2 mb-2"><div><label className="text-[10px] font-bold uppercase text-slate-500">Prossima Revisione</label><input name="rd" type="date" defaultValue={editItem?.reviewDate} className="w-full border p-2 rounded text-sm"/></div><div><label className="text-[10px] font-bold uppercase text-slate-500">Standard Riferimento</label><input name="std" defaultValue={editItem?.standardsRef} className="w-full border p-2 rounded text-sm" placeholder="es. ISO 27001"/></div></div><input name="l" defaultValue={editItem?.docLink} className="w-full border p-2 rounded mb-4 text-sm" placeholder="Link DPIA"/><button className="w-full bg-blue-600 text-white font-bold py-2 rounded">SALVA DPIA</button></form>}

                                {showModal === 'esgEdit' && <div className="space-y-4"><div><label className="text-xs font-bold">Formazione (%)</label><input type="range" min="0" max="100" value={yearData.esgMetrics?.training} onChange={(e) => handleEsgChange('training', e.target.value)} className="w-full"/></div><div><label className="text-xs font-bold">Audit Fornitori (%)</label><input type="range" min="0" max="100" value={yearData.esgMetrics?.supplierAudit} onChange={(e) => handleEsgChange('supplierAudit', e.target.value)} className="w-full"/></div><button onClick={() => setShowModal(null)} className="w-full bg-slate-900 text-white font-bold py-2 rounded">CHIUDI</button></div>}

                                {showModal === 'raci' && <form onSubmit={(e)=>{
                                    e.preventDefault();
                                    const fd=new FormData(e.target);
                                    const item={task:fd.get('t'),r:fd.get('r'),a:fd.get('a'),c:fd.get('c'),i:fd.get('i')};
                                    if(editItem) updateItem('raciItems',{...editItem, ...item},`Modifica RACI: ${item.task}`);
                                    else addItem('raciItems',item,`Nuovo Task RACI: ${item.task}`);
                                }}>
                                    <div className="bg-blue-50 border border-blue-200 text-blue-800 text-xs p-3 rounded mb-4">Definisci i ruoli per l'attività. R=Responsible, A=Accountable, C=Consulted, I=Informed.</div>
                                    <input name="t" defaultValue={editItem?.task} required className="w-full border p-2 rounded mb-3 font-bold" placeholder="Descrizione Attività"/>
                                    <div className="grid grid-cols-2 gap-3 mb-4">
                                        <div><label className="text-[10px] font-bold text-slate-500">RESPONSIBLE (Chi fa)</label><input name="r" defaultValue={editItem?.r} required className="w-full border p-2 rounded text-sm" placeholder="es. IT Manager"/></div>
                                        <div><label className="text-[10px] font-bold text-slate-500">ACCOUNTABLE (Chi approva)</label><input name="a" defaultValue={editItem?.a} required className="w-full border p-2 rounded text-sm" placeholder="es. Direzione"/></div>
                                        <div><label className="text-[10px] font-bold text-slate-500">CONSULTED (Chi aiuta)</label><input name="c" defaultValue={editItem?.c} className="w-full border p-2 rounded text-sm" placeholder="es. DPO"/></div>
                                        <div><label className="text-[10px] font-bold text-slate-500">INFORMED (Chi sa)</label><input name="i" defaultValue={editItem?.i} className="w-full border p-2 rounded text-sm" placeholder="es. Dipendenti"/></div>
                                    </div>
                                    <button className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors">SALVA ATTIVITÀ</button>
                                </form>}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
